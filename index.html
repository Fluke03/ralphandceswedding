
<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#7f8d72">

  <style>
    /* RESET / GLOBAL */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #aeb9a1;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      font-family: Arial, Helvetica, sans-serif;
      color: #52604e;
      background: radial-gradient(
        circle at 50% 0%,
        #d2d8c8 0%,
        #b8c1ac 38%,
        #a5b098 72%,
        #96a38a 100%
      );
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    /* COLORS */
    :root {
      --sage-dark: #4f5d49;
      --sage-deep: #3f4e39;
      --sage: #7f8d72;
      --sage-mid: #909e80;
      --sage-light: #aeb9a1;
      --sage-pale: #e1e6db;
      --cream: #faf8f1;
      --cream-dark: #eeeadd;
      --gold: #c8a45c;
      --gold-dark: #a98542;
      --gold-light: #e2cc91;
      --text: #52604e;
      --text-light: #788274;
      --white: #ffffff;
    }

    /* MAIN PAGE */
    .page {
      position: relative;
      z-index: 5;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px 14px 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* FALLING LEAVES */
    .leaf-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .leaf {
      position: absolute;
      top: -50px;
      width: 12px;
      height: 19px;
      border-radius: 100% 0 100% 0;
      opacity: .5;
      filter: blur(.15px);
      animation:
        leafFall linear infinite,
        leafSwing ease-in-out infinite alternate;
    }

    @keyframes leafFall {
      0% {
        transform: translate3d(0, -60px, 0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: .55;
      }
      90% {
        opacity: .4;
      }
      100% {
        transform: translate3d(0, 115vh, 0) rotate(420deg);
        opacity: 0;
      }
    }

    @keyframes leafSwing {
      from {
        margin-left: -22px;
      }
      to {
        margin-left: 22px;
      }
    }

    /* RSVP CARD */
    .rsvp-card {
      position: relative;
      z-index: 5;
      width: min(820px, 100%);
      margin: 0 auto;
      padding: clamp(34px, 5vw, 58px)
               clamp(18px, 5vw, 56px)
               clamp(40px, 5vw, 62px);
      background: linear-gradient(
        145deg,
        rgba(255,255,255,.97),
        rgba(248,246,238,.98)
      );
      border: 1px solid rgba(200,164,92,.72);
      border-radius: clamp(20px, 4vw, 30px);
      box-shadow:
        0 25px 60px rgba(63,73,57,.20),
        0 8px 20px rgba(63,73,57,.10);
      text-align: center;
    }

    .rsvp-card::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(200,164,92,.18);
      border-radius: inherit;
      pointer-events: none;
    }

    /* BOTANICAL ORNAMENT */
    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    .ornament-line {
      width: clamp(35px, 10vw, 80px);
      height: 1px;
      background: var(--gold);
      opacity: .75;
    }

    .ornament-leaf {
      font-size: clamp(24px, 6vw, 32px);
      color: var(--sage-dark);
      transform: rotate(-8deg);
    }

    /* TITLE / LOGO */
    .rsvp-title {
      display: block;
      width: min(380px, 88vw);
      height: auto;
      max-width: 100%;
      margin: 0 auto;
      padding: 0;
      line-height: 0;
      object-fit: contain;
    }

    .rsvp-subtitle {
      margin: 13px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: clamp(16px, 4vw, 20px);
      color: #687563;
      letter-spacing: .5px;
    }

    .heart {
      display: block;
      margin: 18px 0 28px;
      color: var(--gold);
      font-size: 28px;
      line-height: 1;
    }

    /* FORM */
    .form-wrapper {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      text-align: left;
    }

    .form-group {
      margin-bottom: clamp(20px, 4vw, 25px);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: clamp(15px, 4vw, 18px);
      line-height: 1.35;
      color: #586653;
      font-weight: normal;
    }

    .helper-text {
      margin-top: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      line-height: 1.45;
      font-style: italic;
      color: #879080;
    }

    /* INPUTS */
    input[type="text"],
    select,
    textarea {
      display: block;
      width: 100%;
      min-width: 0;
      border: 1px solid #c8cdbf;
      background: rgba(255,255,255,.82);
      color: #4f5d49;
      border-radius: 14px;
      padding: 15px 16px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.3;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    input[type="text"] {
      min-height: 56px;
    }

    select {
      min-height: 56px;
      padding-right: 42px;
      background-image:
        linear-gradient(
          45deg,
          transparent 50%,
          #65715f 50%
        ),
        linear-gradient(
          135deg,
          #65715f 50%,
          transparent 50%
        );
      background-position:
        calc(100% - 20px) 24px,
        calc(100% - 14px) 24px;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }

    textarea {
      min-height: 115px;
      resize: vertical;
      line-height: 1.5;
    }

    input::placeholder,
    textarea::placeholder {
      color: #a0a79d;
      opacity: 1;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--sage);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(127,141,114,.13);
    }

    /* MAIN BUTTON */
    .main-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      padding: 14px 18px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(135deg, #879577, #718066);
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(13px, 3.5vw, 15px);
      letter-spacing: clamp(3px, 1vw, 6px);
      font-weight: normal;
      cursor: pointer;
      box-shadow:
        0 9px 20px rgba(76,91,67,.20),
        inset 0 1px rgba(255,255,255,.25);
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
    }

    .main-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
      box-shadow: 0 13px 28px rgba(76,91,67,.27);
    }

    .main-button:active {
      transform: scale(.985);
    }

    .main-button:disabled {
      background: #b8beb1;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* CANVA INVITATION BUTTON */
    .invitation-button {
      display: none;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 650px;
      min-height: 56px;
      margin: 16px auto 0;
      padding: 14px 18px;
      border: 1px solid rgba(200,164,92,.72);
      border-radius: 40px;
      background: linear-gradient(135deg, #e3c887, #b99655);
      color: #3f4938;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(13px, 3.5vw, 15px);
      letter-spacing: clamp(2px, .8vw, 4px);
      font-weight: normal;
      text-decoration: none;
      cursor: pointer;
      box-shadow:
        0 9px 20px rgba(76,91,67,.18),
        inset 0 1px rgba(255,255,255,.65);
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
    }

    .invitation-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
      box-shadow: 0 13px 28px rgba(76,91,67,.25);
    }

    .invitation-button:active {
      transform: scale(.985);
    }

    /* RSVP STEP */
    #rsvpStep {
      margin-top: 10px;
    }

    #seatMessage {
      width: 100%;
      padding: 15px 16px;
      margin: 0 0 25px;
      border-radius: 14px;
      background: #edf1e9;
      border: 1px solid #d5dccd;
      color: #65715f;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(19px, 4.5vw, 23px);
      line-height: 1.5;
    }



    /* PERSONALIZED ROLE GREETING */
    #roleGreeting {
      display: none;
      width: 100%;
      margin: 0 auto 22px;
      padding: 8px 10px;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 6vw, 42px);
      line-height: 1.25;
      font-weight: normal;
      color: var(--sage-dark);
      text-wrap: balance;
    }

    @media (max-width: 480px) {
      #roleGreeting {
        font-size: clamp(25px, 7vw, 34px);
        margin-bottom: 18px;
      }
    }

    /* ADDITIONAL GUESTS */
    #additionalGuestsContainer h3 {
      margin: 25px 0 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(18px, 5vw, 22px);
      line-height: 1.3;
      font-weight: normal;
      color: var(--sage-dark);
    }

    /* STATUS MESSAGE */
    .message {
      width: 100%;
      max-width: 650px;
      margin: 22px auto 0;
      padding: 14px 16px;
      border-radius: 14px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .error {
      display: block;
      background: #f6e5e4;
      color: #8a5c5a;
      border: 1px solid #e8c7c5;
    }

    .success {
      display: block;
      background: #e5ecdf;
      color: #5b6b54;
      border: 1px solid #cad8c2;
    }

    .hidden {
      display: none !important;
    }

    /* 3D CURTAIN INTRO */
    #curtainScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 100dvh;
      overflow: hidden;
      perspective: 1400px;
      background: radial-gradient(
        ellipse at center,
        #aeb9a0 0%,
        #89967c 55%,
        #64715c 100%
      );
    }

    .curtain-backdrop {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(239,238,216,.95) 0%,
        rgba(164,174,145,.84) 42%,
        rgba(75,88,67,.90) 100%
      );
      box-shadow: inset 0 0 120px rgba(25,35,25,.4);
    }

    /* CURTAIN PANELS */
    .curtain {
      position: absolute;
      top: -3%;
      width: 55%;
      height: 108%;
      z-index: 5;
      overflow: hidden;
      transform-style: preserve-3d;
      transition:
        transform 1.9s cubic-bezier(.77,0,.18,1),
        filter 1.9s ease;
    }

    .curtain::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.09) 0px,
        rgba(255,255,255,.09) 5px,
        rgba(0,0,0,.09) 14px,
        rgba(0,0,0,.09) 23px,
        rgba(255,255,255,.06) 34px
      );
      mix-blend-mode: overlay;
      opacity: .65;
    }

    .curtain::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        #34412f 0%,
        #647359 8%,
        #3f4d39 16%,
        #7d8d70 25%,
        #3d4a36 34%,
        #7f8e72 44%,
        #3a4835 53%,
        #75856b 63%,
        #394634 73%,
        #77866d 83%,
        #354230 92%,
        #637158 100%
      );
      z-index: -1;
    }

    .curtain-left {
      left: -5%;
      transform-origin: left center;
      clip-path: polygon(0 0, 100% 0, 93% 100%, 0 100%);
      box-shadow: 25px 0 60px rgba(25,35,25,.5);
    }

    .curtain-right {
      right: -5%;
      transform-origin: right center;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 7% 100%);
      box-shadow: -25px 0 60px rgba(25,35,25,.5);
    }

    /* GOLD EDGE */
    .curtain-left .gold-edge,
    .curtain-right .gold-edge {
      position: absolute;
      top: 0;
      height: 100%;
      width: 3px;
      background: linear-gradient(
        to bottom,
        #e2cb91,
        #b79650,
        #e0c889,
        #b08d49
      );
      box-shadow: 0 0 10px rgba(224,200,137,.5);
    }

    .curtain-left .gold-edge {
      right: 3%;
    }

    .curtain-right .gold-edge {
      left: 3%;
    }

    /* TIEBACKS */
    .tieback {
      position: absolute;
      top: 51%;
      z-index: 15;
      width: clamp(65px, 11vw, 105px);
      height: clamp(9px, 1.5vw, 13px);
      background: linear-gradient(90deg, #a9823c, #e2ca8c, #a9823c);
      box-shadow: 0 3px 10px rgba(0,0,0,.25);
      border-radius: 10px;
    }

    .tieback-left {
      left: 0;
      transform: rotate(-5deg);
    }

    .tieback-right {
      right: 0;
      transform: rotate(5deg);
    }

    .tieback::before {
      content: "";
      position: absolute;
      top: clamp(-12px, -2vw, -13px);
      width: clamp(27px, 4vw, 35px);
      height: clamp(27px, 4vw, 35px);
      border-radius: 50%;
      background: radial-gradient(circle, #e3cd94 0%, #b48f4b 70%);
      box-shadow: 0 3px 7px rgba(0,0,0,.25);
    }

    .tieback-left::before {
      right: -12px;
    }

    .tieback-right::before {
      left: -12px;
    }

    /* TASSEL */
    .tassel {
      position: absolute;
      top: 53%;
      width: clamp(13px, 2vw, 18px);
      height: clamp(60px, 8vw, 90px);
      background: linear-gradient(90deg, #9f7d40, #ead49a, #aa8747);
      border-radius: 0 0 10px 10px;
      z-index: 16;
      box-shadow: 0 4px 12px rgba(0,0,0,.25);
    }

    .tassel-left {
      left: clamp(45px, 9vw, 88px);
    }

    .tassel-right {
      right: clamp(45px, 9vw, 88px);
    }

    /* CURTAIN CONTENT */
    .curtain-content {
      position: absolute;
      z-index: 20;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      padding: 20px;
      transition: opacity .7s ease, transform 1.1s ease;
    }

    .curtain-inner {
      width: min(600px, 88vw);
      padding: 20px;
    }

    .curtain-leaf {
      font-size: clamp(28px, 7vw, 40px);
      color: #d5d9bd;
      margin-bottom: 4px;
    }

    .curtain-title {
      margin: 0 0 35px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 8vw, 70px);
      line-height: 1.05;
      font-weight: normal;
      letter-spacing: clamp(4px, 1.5vw, 8px);
      color: #f4f0db;
      text-shadow: 0 4px 20px rgba(0,0,0,.35);
      white-space: nowrap;
    }

    .curtain-rsvp {
      margin: 0 0 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(52px, 14vw, 95px);
      line-height: .95;
      font-weight: normal;
      letter-spacing: clamp(3px, 1vw, 5px);
      color: #eadcb5;
      text-shadow: 0 5px 20px rgba(0,0,0,.35);
    }

    .curtain-subtitle {
      margin: 0 0 28px;
      color: #f2f0e3;
      letter-spacing: clamp(2px, 1vw, 5px);
      font-size: clamp(9px, 2.8vw, 14px);
      line-height: 1.5;
    }

    /* OPEN INVITATION BUTTON */
    .open-button {
      width: min(270px, 80vw);
      min-height: 54px;
      padding: 13px 20px;
      border-radius: 40px;
      border: 1px solid #ead39b;
      background: linear-gradient(135deg, #e3c887, #b99655);
      color: #3d4434;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(13px, 3.5vw, 16px);
      letter-spacing: clamp(2px, .8vw, 3px);
      cursor: pointer;
      box-shadow:
        0 12px 30px rgba(0,0,0,.3),
        inset 0 1px rgba(255,255,255,.7);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .open-button:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 17px 35px rgba(0,0,0,.38);
    }

    .open-button:active {
      transform: scale(.98);
    }

    /* CURTAIN OPEN */
    #curtainScreen.opening .curtain-left {
      transform: translateX(-108%) rotateY(22deg) rotateZ(-2deg) scaleX(.88);
      filter: brightness(.8);
    }

    #curtainScreen.opening .curtain-right {
      transform: translateX(108%) rotateY(-22deg) rotateZ(2deg) scaleX(.88);
      filter: brightness(.8);
    }

    #curtainScreen.opening .curtain-content {
      opacity: 0;
      transform: translateZ(-250px) scale(.8);
    }

    #curtainScreen.opening .curtain-backdrop {
      filter: brightness(1.15);
    }

    #curtainScreen.opened {
      display: none;
    }

    /* MOBILE — 480px AND BELOW */
    @media (max-width: 480px) {
      .page {
        min-height: 100svh;
        padding: 18px 10px 38px;
      }

      .rsvp-card {
        width: 100%;
        padding: 30px 16px 36px;
        border-radius: 22px;
      }

      .ornament {
        gap: 9px;
        margin-bottom: 8px;
      }

      .ornament-line {
        width: 38px;
      }

      .rsvp-title {
        width: min(330px, 88vw);
        max-width: 100%;
      }

      .rsvp-subtitle {
        font-size: 16px;
        margin-top: 10px;
      }

      .heart {
        margin: 16px 0 25px;
        font-size: 25px;
      }

      .helper-text {
        font-size: 13px;
      }

      input[type="text"],
      select {
        min-height: 54px;
        border-radius: 12px;
        padding: 14px;
      }

      textarea {
        min-height: 110px;
        border-radius: 12px;
      }

      .main-button {
        min-height: 55px;
        border-radius: 30px;
      }

      .invitation-button {
        min-height: 55px;
        border-radius: 30px;
        font-size: 12px;
        letter-spacing: 2px;
      }

      #seatMessage {
        padding: 14px;
        font-size: 18px;
      }

      .curtain {
        width: 57%;
        height: 108%;
      }

      .curtain-left {
        left: -9%;
      }

      .curtain-right {
        right: -9%;
      }

      .curtain-inner {
        width: 82vw;
        padding: 10px;
      }

      .curtain-leaf {
        font-size: 30px;
      }

      .curtain-title {
        font-size: 30px;
        letter-spacing: 4px;
        white-space: nowrap;
      }

      .curtain-rsvp {
        font-size: 57px;
        letter-spacing: 3px;
        margin-bottom: 13px;
      }

      .curtain-subtitle {
        font-size: 9px;
        letter-spacing: 2px;
        margin-bottom: 25px;
      }

      .open-button {
        width: min(250px, 75vw);
        min-height: 52px;
        font-size: 13px;
      }

      .tieback {
        top: 51%;
        width: 65px;
      }

      .tassel-left {
        left: 43px;
      }

      .tassel-right {
        right: 43px;
      }
    }

    /* VERY SMALL PHONES — 360px AND BELOW */
    @media (max-width: 360px) {
      .page {
        padding: 12px 8px 30px;
      }

      .rsvp-card {
        padding: 27px 13px 32px;
        border-radius: 19px;
      }

      .rsvp-title {
        width: min(290px, 88vw);
        max-width: 100%;
      }

      .rsvp-subtitle {
        font-size: 15px;
      }

      .ornament-line {
        width: 30px;
      }

      label {
        font-size: 15px;
      }

      .main-button {
        font-size: 12px;
        letter-spacing: 3px;
      }

      .invitation-button {
        font-size: 11px;
        letter-spacing: 1.5px;
      }

      .curtain-title {
        font-size: 27px;
        letter-spacing: 3px;
        white-space: nowrap;
      }

      .curtain-rsvp {
        font-size: 51px;
      }

      .curtain-subtitle {
        font-size: 8px;
        letter-spacing: 1.8px;
      }

      .open-button {
        width: 220px;
        font-size: 12px;
      }

      .tieback {
        width: 57px;
      }

      .tassel-left {
        left: 36px;
      }

      .tassel-right {
        right: 36px;
      }
    }

    /* LANDSCAPE MOBILE */

      .curtain-inner {
        transform: scale(.72);

      *::before,
      *::after {

        transition-duration: .01ms !important;
      }

      .leaf-container {
        display: none;
      }

  <!-- JAVASCRIPT -->
  <script>
    /* OPEN CURTAIN */
    function openInvitation() {
      const curtain = document.getElementById('curtainScreen');
      if (!curtain) return;

      curtain.classList.add('opening');

      setTimeout(function() {
        curtain.classList.add('opened');

        const nameInput = document.getElementById('fullName');

        if (nameInput) {
          setTimeout(function() {
            nameInput.focus();
          }, 100);
        }
      }, 1950);
    }

    /* FALLING LEAVES */
    function createLeaves() {
      const container = document.getElementById('leafContainer');
      if (!container) return;

      const colors = [
        '#8d9b7d',
        '#aeb99e',
        '#c6b785',
        '#d2c397',
        '#758569'
      ];

      let leafCount;

      if (window.innerWidth <= 360) {
        leafCount = 7;
      } else if (window.innerWidth <= 600) {
        leafCount = 10;
      } else {
        leafCount = 22;
      }

      for (let i = 0; i < leafCount; i++) {
        const leaf = document.createElement('div');
        leaf.className = 'leaf';

        leaf.style.left = Math.random() * 100 + 'vw';

        leaf.style.animationDuration =
          (Math.random() * 7 + 7) + 's';

        leaf.style.animationDelay =
          Math.random() * 10 + 's';

        leaf.style.backgroundColor =
          colors[Math.floor(Math.random() * colors.length)];

        const size = Math.random() * 9 + 8;

        leaf.style.width = size + 'px';
        leaf.style.height = (size * 1.4) + 'px';

        container.appendChild(leaf);
      }
    }

    window.addEventListener('DOMContentLoaded', createLeaves);

    /* GUEST DATA */
    let guestData = {};

    /* SHOW MESSAGE */
    function showMessage(text, isError) {
      const msgDiv = document.getElementById('statusMessage');
      if (!msgDiv) return;

      msgDiv.innerText = text || '';

      msgDiv.className = isError
        ? 'message error'
        : 'message success';
    }

    /* CLEAR MESSAGE */
    function clearMessage() {
      const msgDiv = document.getElementById('statusMessage');
      if (!msgDiv) return;

      msgDiv.innerText = '';
      msgDiv.className = 'message';
    }

    /* SEARCH GUEST */
    function handleContinue() {
      const input = document.getElementById('fullName');
      if (!input) return;

      const nameInput = input.value.trim();

      if (!nameInput) {
        showMessage('Please enter your name.', true);
        input.focus();
        return;
      }

      const btn = document.getElementById('btnContinue');

      btn.disabled = true;
      btn.innerText = 'SEARCHING...';

      clearMessage();

      google.script.run
        .withSuccessHandler(function(result) {
          btn.disabled = false;
          btn.innerText = 'CONTINUE';

          if (result && result.found) {
            guestData = result;

            document.getElementById('searchStep')
              .classList.add('hidden');

            document.getElementById('rsvpStep')
              .classList.remove('hidden');

            document.getElementById('seatMessage').innerText =
              result.message || '';

            // Display a centered personalized greeting based on the guest's role.
            const roleGreeting = document.getElementById('roleGreeting');
            if (roleGreeting) {
              const role = String(
                result.role || result.Role || result.guestRole || ''
              ).trim().toLowerCase();

              const roleMessages = {
                'groomsmen': '"You are one of Our Handsome Groomsmen"',
                'bridesmaid': '"You are one of Our Gorgeous Bridesmaid"',
                'bestman': '"Hi My Brother"',
                'best man': '"Hi My Brother"',
                'maid of honor': '"Hi My Fabulous Maid of Honor"',
                'maid of honour': '"Hi My Fabulous Maid of Honor"',
                'sponsor': '"Hi My Dearest Godparent"',
                'mother': '"Hi My Lovely Mother"',
                'father': '"Hi My Handsome Father"'
              };

              const greeting = roleMessages[role] || '';
              roleGreeting.textContent = greeting;
              roleGreeting.style.display = greeting ? 'block' : 'none';
            }

            createAdditionalGuests(result.additionalGuests || 0);

            const invitationButton =
              document.getElementById('formalInvitationButton');

            if (invitationButton) {
              invitationButton.style.display = 'none';
            }

            if (window.innerWidth <= 600) {
              setTimeout(function() {
                document.getElementById('rsvpStep')
                  .scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                  });
              }, 150);
            }
          } else {
            showMessage(
              result && result.message
                ? result.message
                : 'You are not listed.',
              true
            );
          }
        })
        .withFailureHandler(function(error) {
          btn.disabled = false;
          btn.innerText = 'CONTINUE';

          showMessage(
            'Error: ' +
            (error && error.message
              ? error.message
              : 'Unable to search for guest.'),
            true
          );
        })
        .checkGuest(nameInput);
    }

    /* CREATE ADDITIONAL GUEST INPUTS */
    function createAdditionalGuests(count) {
      const container =
        document.getElementById('additionalGuestsContainer');

      container.innerHTML = '';

      if (!count || count <= 0) {
        return;
      }

      const heading = document.createElement('h3');
      heading.innerText = 'Additional Guest Names';
      container.appendChild(heading);

      for (let i = 0; i < count; i++) {
        const group = document.createElement('div');
        group.className = 'form-group';

        const label = document.createElement('label');
        label.innerText = 'Guest ' + (i + 1) + ' Full Name';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'additional-guest-input';
        input.placeholder = 'Guest ' + (i + 1);
        input.autocomplete = 'off';
        input.autocapitalize = 'words';

        group.appendChild(label);
        group.appendChild(input);
        container.appendChild(group);
      }
    }

    /* SUBMIT RSVP */
    function handleSubmit() {
      const response = document.getElementById('response');
      if (!response) return;

      const responseVal = response.value;

      if (!responseVal) {
        showMessage(
          'Please select whether you will attend.',
          true
        );
        response.focus();
        return;
      }

      const isJoyfullyAccepted =
        responseVal === 'Joyfully Accepts';

      const btn = document.getElementById('btnSubmit');

      btn.disabled = true;
      btn.innerText = 'SUBMITTING...';

      clearMessage();

      const invitationButton =
        document.getElementById('formalInvitationButton');

      if (invitationButton) {
        invitationButton.style.display = 'none';
      }

      const guestInputs =
        document.querySelectorAll('.additional-guest-input');

      const additionalGuests = [];

      guestInputs.forEach(function(input) {
        const value = input.value.trim();

        if (value !== '') {
          additionalGuests.push(value);
        }
      });

      const submissionData = {
        fullName: guestData.name,
        // Preserve the guest's existing role when submitting the RSVP.
        // This passes the role returned by checkGuest() to submitRSVP().
        role: guestData.role || guestData.Role || guestData.guestRole || '',
        response: responseVal,
        comment: document.getElementById('comment').value.trim(),
        additionalGuests: additionalGuests
      };

      google.script.run
        .withSuccessHandler(function(result) {
          btn.disabled = false;
          btn.innerText = 'SUBMIT RSVP';

          if (result && result.success) {
            document.getElementById('rsvpStep')
              .classList.add('hidden');

            /*
             * UPDATED SUBTITLE:
             * Joyfully Accepts: invitation message.
             * Regretfully Declines: "Enjoy".
             */
            const rsvpSubtitle =
              document.getElementById('rsvpSubtitle');

            if (rsvpSubtitle) {
              if (isJoyfullyAccepted) {
                rsvpSubtitle.textContent =
                  '"Your presence would mean the world to us.\n' +
                  'Please tap the button below to view our official wedding invitation."';
              } else {
                rsvpSubtitle.textContent = 
                '"We regret that you cannot attend, we entirely understand.\n' +
                'We wish you all the best and hope to see you another time."';
              }

              rsvpSubtitle.style.whiteSpace = 'pre-line';
            }

            showMessage(
              result.message ||
              'Your RSVP has been submitted successfully.',
              false
            );

            /*
             * Show the formal invitation button
             * ONLY for Joyfully Accepts.
             */
            if (isJoyfullyAccepted && invitationButton) {
              invitationButton.style.display = 'flex';
            }
          } else {
            showMessage(
              result && result.message
                ? result.message
                : 'Unable to submit your RSVP.',
              true
            );
          }
        })
        .withFailureHandler(function(error) {
          btn.disabled = false;
          btn.innerText = 'SUBMIT RSVP';

          showMessage(
            'Submission Error: ' +
            (error && error.message
              ? error.message
              : 'Unable to submit RSVP.'),
            true
          );
        })
        .submitRSVP(submissionData);
    }

    /* ENTER KEY — GUEST NAME */
    document.addEventListener('DOMContentLoaded', function() {
      const nameInput = document.getElementById('fullName');
      if (!nameInput) return;

      nameInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          handleContinue();
        }
      });
    });
  </script>

</body>
</html>
